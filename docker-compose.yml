services:
  db:
    image: postgres:16
    container_name: gym_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
  cache:
    image: redis:7.2
    container_name: gym_cache
    environment:
      REDIS_HOST: ${REDIS_HOST}
    ports:
      - "${REDIS_PORT}:6379"